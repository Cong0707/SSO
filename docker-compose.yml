services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sso}
      POSTGRES_USER: ${POSTGRES_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sso-dev-redis-password}
    command:
      - /bin/sh
      - -c
      - exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  sso:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SSO_ISSUER: ${SSO_ISSUER:-http://127.0.0.1:8080}
      SSO_COOKIE_SECURE: ${SSO_COOKIE_SECURE:-false}
      SSO_REGISTRATION_ENABLED: ${SSO_REGISTRATION_ENABLED:-true}
      SSO_EMAIL_DEBUG: ${SSO_EMAIL_DEBUG:-false}
      SSO_DATABASE_DRIVER: postgres
      SSO_DATABASE_DSN: "host=postgres user=${POSTGRES_USER:-sso} password=${POSTGRES_PASSWORD:-sso-dev-password} dbname=${POSTGRES_DB:-sso} port=5432 sslmode=disable TimeZone=UTC"
      SSO_RATE_LIMIT_ENABLED: ${SSO_RATE_LIMIT_ENABLED:-true}
      SSO_REDIS_ADDR: redis:6379
      SSO_REDIS_PASSWORD: ${REDIS_PASSWORD:-sso-dev-redis-password}
      SSO_REDIS_DB: ${SSO_REDIS_DB:-0}
      SSO_REDIS_TLS: "false"
      SSO_REDIS_KEY_PREFIX: ${SSO_REDIS_KEY_PREFIX:-xem-sso}
      SSO_RATE_LIMIT_IDENTIFY: ${SSO_RATE_LIMIT_IDENTIFY:-30}
      SSO_RATE_LIMIT_LOGIN: ${SSO_RATE_LIMIT_LOGIN:-10}
      SSO_RATE_LIMIT_EMAIL: ${SSO_RATE_LIMIT_EMAIL:-5}
      SSO_RATE_LIMIT_OAUTH_TOKEN: ${SSO_RATE_LIMIT_OAUTH_TOKEN:-120}
      SSO_RATE_LIMIT_SENSITIVE: ${SSO_RATE_LIMIT_SENSITIVE:-60}
      SSO_DATA_DIR: /app/data
      SSO_MASTER_KEY_FILE: /app/data/master.key
      SSO_OIDC_SIGNING_KEY_FILE: /app/data/oidc-signing.pem
      SSO_ALLOW_KEY_GENERATION: "true"
      SSO_SMTP_HOST: ${SSO_SMTP_HOST:-}
      SSO_SMTP_PORT: ${SSO_SMTP_PORT:-587}
      SSO_SMTP_USERNAME: ${SSO_SMTP_USERNAME:-}
      SSO_SMTP_PASSWORD: ${SSO_SMTP_PASSWORD:-}
      SSO_SMTP_FROM: ${SSO_SMTP_FROM:-}
      SSO_CAPTCHA_MODE: ${SSO_CAPTCHA_MODE:-none}
      SSO_TURNSTILE_SITE_KEY: ${SSO_TURNSTILE_SITE_KEY:-}
      SSO_TURNSTILE_SECRET_KEY: ${SSO_TURNSTILE_SECRET_KEY:-}
      SSO_CAP_SITE_KEY: ${SSO_CAP_SITE_KEY:-}
      SSO_CAP_SECRET_KEY: ${SSO_CAP_SECRET_KEY:-}
      SSO_CAP_SERVER_URL: ${SSO_CAP_SERVER_URL:-http://cap:3000}
      SSO_GITHUB_CLIENT_ID: ${SSO_GITHUB_CLIENT_ID:-}
      SSO_GITHUB_CLIENT_SECRET: ${SSO_GITHUB_CLIENT_SECRET:-}
      SSO_DISCORD_CLIENT_ID: ${SSO_DISCORD_CLIENT_ID:-}
      SSO_DISCORD_CLIENT_SECRET: ${SSO_DISCORD_CLIENT_SECRET:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_ISSUER: ${SSO_OIDC_ISSUER:-}
      SSO_LINUXDO_CLIENT_ID: ${SSO_LINUXDO_CLIENT_ID:-}
      SSO_LINUXDO_CLIENT_SECRET: ${SSO_LINUXDO_CLIENT_SECRET:-}
      SSO_TELEGRAM_BOT_TOKEN: ${SSO_TELEGRAM_BOT_TOKEN:-}
      SSO_TELEGRAM_BOT_USERNAME: ${SSO_TELEGRAM_BOT_USERNAME:-}
      SSO_WECHAT_CLIENT_ID: ${SSO_WECHAT_CLIENT_ID:-}
      SSO_WECHAT_CLIENT_SECRET: ${SSO_WECHAT_CLIENT_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - sso-data:/app/data

volumes:
  postgres-data:
  sso-data:
