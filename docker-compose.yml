services:
  sso:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SSO_ISSUER: ${SSO_ISSUER:-http://127.0.0.1:8080}
      SSO_COOKIE_SECURE: ${SSO_COOKIE_SECURE:-false}
      SSO_REGISTRATION_ENABLED: ${SSO_REGISTRATION_ENABLED:-true}
      SSO_INVITE_REQUIRED: ${SSO_INVITE_REQUIRED:-false}
      SSO_GITHUB_CLIENT_ID: ${SSO_GITHUB_CLIENT_ID:-}
      SSO_GITHUB_CLIENT_SECRET: ${SSO_GITHUB_CLIENT_SECRET:-}
      SSO_DISCORD_CLIENT_ID: ${SSO_DISCORD_CLIENT_ID:-}
      SSO_DISCORD_CLIENT_SECRET: ${SSO_DISCORD_CLIENT_SECRET:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_ISSUER: ${SSO_OIDC_ISSUER:-}
      SSO_LINUXDO_CLIENT_ID: ${SSO_LINUXDO_CLIENT_ID:-}
      SSO_LINUXDO_CLIENT_SECRET: ${SSO_LINUXDO_CLIENT_SECRET:-}
      SSO_TELEGRAM_BOT_TOKEN: ${SSO_TELEGRAM_BOT_TOKEN:-}
      SSO_WECHAT_CLIENT_ID: ${SSO_WECHAT_CLIENT_ID:-}
      SSO_WECHAT_CLIENT_SECRET: ${SSO_WECHAT_CLIENT_SECRET:-}
    volumes:
      - sso-data:/app/data

volumes:
  sso-data:
