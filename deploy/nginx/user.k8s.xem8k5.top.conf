server {
    listen 80;
    listen [::]:80;
    server_name user.k8s.xem8k5.top user.xem8k5.top;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name user.k8s.xem8k5.top;

    ssl_certificate /etc/nginx/ssl/user.k8s.xem8k5.top.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/user.k8s.xem8k5.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSO_SSL:10m;

    client_max_body_size 10m;

    location = /.well-known/openid-configuration {
        include /etc/nginx/snippets/sso-internal-origin.conf;
    }

    location = /oauth/token {
        include /etc/nginx/snippets/sso-internal-origin.conf;
    }

    location = /oauth/userinfo {
        include /etc/nginx/snippets/sso-internal-origin.conf;
    }

    location = /oauth/jwks.json {
        include /etc/nginx/snippets/sso-internal-origin.conf;
    }

    location = /livez {
        include /etc/nginx/snippets/sso-internal-origin.conf;
    }

    location = /readyz {
        include /etc/nginx/snippets/sso-internal-origin.conf;
    }

    location = /healthz {
        include /etc/nginx/snippets/sso-internal-origin.conf;
    }

    location / {
        return 308 https://user.xem8k5.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name user.xem8k5.top;

    ssl_certificate /etc/nginx/ssl/user.k8s.xem8k5.top.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/user.k8s.xem8k5.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSO_SSL:10m;

    client_max_body_size 10m;

    location / {
        resolver 10.96.0.10 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $sso_upstream sso.sso.svc.cluster.local;

        proxy_pass http://$sso_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}
