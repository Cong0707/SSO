apiVersion: v1
kind: Secret
metadata:
  name: sso-secrets
  namespace: sso
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
  SSO_DATABASE_DSN: "host=postgres user=sso password=REPLACE_WITH_A_LONG_RANDOM_PASSWORD dbname=sso port=5432 sslmode=disable TimeZone=UTC"
  SSO_GITHUB_CLIENT_ID: ""
  SSO_GITHUB_CLIENT_SECRET: ""
  SSO_DISCORD_CLIENT_ID: ""
  SSO_DISCORD_CLIENT_SECRET: ""
  SSO_OIDC_CLIENT_ID: ""
  SSO_OIDC_CLIENT_SECRET: ""
  SSO_OIDC_ISSUER: ""
  SSO_LINUXDO_CLIENT_ID: ""
  SSO_LINUXDO_CLIENT_SECRET: ""
  SSO_TELEGRAM_BOT_TOKEN: ""
  SSO_WECHAT_CLIENT_ID: ""
  SSO_WECHAT_CLIENT_SECRET: ""
  master.key: "REPLACE_WITH_BASE64_RAW_32_BYTE_KEY"
  oidc-signing.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_A_2048_BIT_RSA_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----

