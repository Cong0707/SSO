apiVersion: postgres-operator.crunchydata.com/v1
kind: PostgresCluster
metadata:
  name: sso-postgres
  namespace: sso
spec:
  postgresVersion: 18
  instances:
    - name: ovh
      replicas: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ovh-1
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 20Gi
    - name: bwg
      replicas: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cool-bliss-1.localdomain
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 20Gi
  patroni:
    dynamicConfiguration:
      ttl: 30
      loop_wait: 10
      retry_timeout: 10
      synchronous_mode: true
      synchronous_mode_strict: false
      synchronous_node_count: 1
      postgresql:
        parameters:
          max_connections: "120"
          wal_log_hints: "on"
  backups:
    pgbackrest:
      global:
        repo1-retention-full: "2"
        repo1-retention-full-type: count
        repo1-retention-diff: "7"
        repo1-retention-archive: "2"
        repo1-retention-archive-type: full
      repoHost:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - ovh-1
                        - cool-bliss-1.localdomain
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes: [ReadWriteOnce]
              storageClassName: rook-ceph-block
              resources:
                requests:
                  storage: 30Gi
          schedules:
            full: "0 3 * * 0"
            differential: "0 3 * * 1-6"
            incremental: "0 */6 * * *"
  users:
    - name: sso
      databases: [sso]
      password:
        type: ASCII
  proxy:
    pgBouncer:
      replicas: 2
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ovh-1
                      - cool-bliss-1.localdomain
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  postgres-operator.crunchydata.com/cluster: sso-postgres
                  postgres-operator.crunchydata.com/role: pgbouncer
              topologyKey: kubernetes.io/hostname
