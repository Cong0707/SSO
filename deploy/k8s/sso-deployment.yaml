apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Exactly two eligible nodes are combined with required pod anti-affinity.
      # Replace one Pod at a time so a third unschedulable surge Pod cannot
      # deadlock the rollout while the other replica remains available.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sso
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cool-bliss-1.localdomain
                      - ovh-1
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sso
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
        - name: sso
          image: docker.io/library/sso:git-c7e1849
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sso-config
            - secretRef:
                name: sso-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sso-data
              mountPath: /app/data
            - name: sso-keys
              mountPath: /var/run/secrets/sso
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sso-data
          persistentVolumeClaim:
            claimName: sso-data
        - name: sso-keys
          secret:
            secretName: sso-secrets
            items:
              - key: master.key
                path: master.key
              - key: oidc-signing.pem
                path: oidc-signing.pem
        - name: tmp
          emptyDir: {}
