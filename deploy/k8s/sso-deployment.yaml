apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sso
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
        - name: sso
          image: ghcr.io/cong0707/sso:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sso-config
            - secretRef:
                name: sso-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sso-data
              mountPath: /app/data
            - name: sso-keys
              mountPath: /var/run/secrets/sso
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sso-data
          persistentVolumeClaim:
            claimName: sso-data
        - name: sso-keys
          secret:
            secretName: sso-secrets
            items:
              - key: master.key
                path: master.key
              - key: oidc-signing.pem
                path: oidc-signing.pem
        - name: tmp
          emptyDir: {}
