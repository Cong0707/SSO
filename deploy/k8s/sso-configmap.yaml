apiVersion: v1
kind: ConfigMap
metadata:
  name: sso-config
data:
  SSO_ADDR: ":8080"
  SSO_ISSUER: "https://sso.example.com"
  SSO_DATABASE_DRIVER: "postgres"
  SSO_DATA_DIR: "/app/data"
  SSO_MASTER_KEY_FILE: "/var/run/secrets/sso/master.key"
  SSO_OIDC_SIGNING_KEY_FILE: "/var/run/secrets/sso/oidc-signing.pem"
  SSO_ALLOW_KEY_GENERATION: "false"
  SSO_WEB_DIR: "/app/web/dist"
  SSO_COOKIE_SECURE: "true"
  SSO_SESSION_TTL: "720h"
  SSO_REGISTRATION_ENABLED: "true"
  SSO_EMAIL_DEBUG: "false"
  SSO_SMTP_PORT: "587"
  SSO_CAPTCHA_MODE: "none"
  SSO_CAP_SERVER_URL: "http://cap:3000"
  SSO_TRUSTED_PROXIES: "10.0.0.0/8"
