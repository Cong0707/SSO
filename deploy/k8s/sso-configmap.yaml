apiVersion: v1
kind: ConfigMap
metadata:
  name: sso-config
data:
  SSO_ADDR: ":8080"
  SSO_ISSUER: "https://user.xem8k5.top"
  SSO_DATABASE_DRIVER: "postgres"
  SSO_DATA_DIR: "/app/data"
  SSO_MASTER_KEY_FILE: "/var/run/secrets/sso/master.key"
  SSO_OIDC_SIGNING_KEY_FILE: "/var/run/secrets/sso/oidc-signing.pem"
  SSO_ALLOW_KEY_GENERATION: "false"
  SSO_WEB_DIR: "/app/web/dist"
  SSO_COOKIE_SECURE: "true"
  SSO_SESSION_TTL: "720h"
  SSO_REGISTRATION_ENABLED: "false"
  SSO_AUTO_MIGRATE: "false"
  SSO_EMAIL_DEBUG: "false"
  SSO_SMTP_PORT: "587"
  SSO_CAPTCHA_MODE: "cap"
  SSO_CAP_SERVER_URL: "http://cap.new-api.svc.cluster.local:3000"
  SSO_TRUSTED_PROXIES: "10.250.0.0/16,10.200.0.0/16"
  SSO_RATE_LIMIT_ENABLED: "true"
  SSO_REDIS_ADDR: "sso-redis-primary.sso.svc.cluster.local:6379"
  SSO_REDIS_DB: "0"
  SSO_REDIS_TLS: "false"
  SSO_REDIS_KEY_PREFIX: "xem-sso"
  SSO_RATE_LIMIT_IDENTIFY: "30"
  SSO_RATE_LIMIT_LOGIN: "10"
  SSO_RATE_LIMIT_EMAIL: "5"
  SSO_RATE_LIMIT_OAUTH_TOKEN: "120"
  SSO_RATE_LIMIT_SENSITIVE: "60"
