apiVersion: batch/v1
kind: Job
metadata:
  name: sso-schema-migrate
  namespace: sso
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sso-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: docker.io/library/sso:git-2cf0221
          imagePullPolicy: IfNotPresent
          command: ["/app/sso-migrate"]
          envFrom:
            - configMapRef:
                name: sso-config
            - secretRef:
                name: sso-secrets
          env:
            - name: SSO_AUTO_MIGRATE
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sso-data
              mountPath: /app/data
            - name: sso-keys
              mountPath: /var/run/secrets/sso
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sso-data
          persistentVolumeClaim:
            claimName: sso-data
        - name: sso-keys
          secret:
            secretName: sso-secrets
            items:
              - key: master.key
                path: master.key
              - key: oidc-signing.pem
                path: oidc-signing.pem
        - name: tmp
          emptyDir: {}
